name: Publish Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: >
          dotnet publish MediaSavodxonlik/MediaSavodxonlik.csproj
          -c Release
          -r win-x64
          --self-contained true
          -o artifacts/MediaSavodxonlik
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaSavodxonlik-win-x64
          path: artifacts/MediaSavodxonlik/
          retention-days: 7
